name: image
on:
  push:
    branches: [main]
    paths: ["tracker/**", "requirements.txt", "Dockerfile", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # needed to push to ghcr.io with the built-in token; no extra secret to manage

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/application-tracker
          # sha-1234567 tags are immutable, so a manifest always names exactly the code that runs
          tags: |
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
